name: Submit and validate dependencies of GitHub Actions

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '33 4 * * *'

permissions: {}

jobs:
  submit-actions-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jessehouwing/actions-dependency-submission@811981eec3c108f41783f194522fde91a34301a4 # 2.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # 5.0.1
        if: github.event_name == 'pull_request'
        with:
          retry-on-snapshot-warnings: true
